# ==============================================================================
# Paperplane 配置文件模板（首次启动自动复制为 config.toml，也可手动复制后修改）
#
# 安全与覆写说明：
#   1. config.toml 与 config.local.toml 已加入 .gitignore，不会误提交个人凭证；
#   2. api_id / api_hash 也可通过系统环境变量 TG_API_ID / TG_API_HASH 提供；
#   3. 如需把敏感凭证或本机差异拆分出去，可创建同级 config.local.toml，启动时会自动覆盖合并。
#
# 语法提醒（TOML）：
#   - 字符串（api_hash、IP 地址、路径、关键词列表项、带单位的大小）必须加引号 "..."
#   - 数字（api_id、端口、并发数、纯字节数 0）与布尔值（true / false）不要加引号
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Telegram API 凭证（必填，也可改用环境变量 TG_API_ID / TG_API_HASH）
#    申请地址：https://my.telegram.org -> API development tools
# ------------------------------------------------------------------------------
[telegram]
# api_id = 12345678                              # 纯数字，不要加引号
# api_hash = "0123456789abcdef0123456789abcdef"  # 32 位十六进制字符串，必须加引号

# ------------------------------------------------------------------------------
# 2. 下载与存储设置
# ------------------------------------------------------------------------------
[download]
dir = "downloads"        # 媒体文件保存根目录（支持相对路径或绝对路径）
data_dir = "data"        # 存放登录 session、SQLite 缓存、头像与 UI 偏好的目录
concurrency = 3          # 全局最大同时下载文件数（所有频道共享上限，建议 3-5）

# 自定义下载子目录路径模板（用 "/" 分隔层级，留空则直接存在 dir 根目录）
# 可用变量：
#   {include}    命中的 include 关键词（自动去除 "#"，空白替换为 "_"，留空归入 all）
#   {media_type} 媒体类型（video / photo / document / audio / gif / voice 等）
#   {channel}    频道名称（优先取频道 name，否则取频道标题）
#   {date}       消息发送日期（YYYY-MM-DD）
#   {month}      消息发送年月（YYYY-MM）
#   {year}       消息发送年份（YYYY）
path_template = "{include}/{media_type}"

# ------------------------------------------------------------------------------
# 3. 防风控限流与重试设置（一般保持默认即可）
# ------------------------------------------------------------------------------
[limits]
request_interval = 1.0        # 两次 API 请求之间的最小间隔（秒）
request_jitter = 0.5          # 每次请求附加的随机抖动上限（秒）
flood_sleep_threshold = 120   # 低于此秒数的 FloodWait 由 Telethon 自动静默等待
max_flood_wait = 3600         # 超过此秒数的 FloodWait 直接停止运行以保护账号
max_retries = 3               # 单文件下载失败后的最大重试次数

# ------------------------------------------------------------------------------
# 4. 网络代理设置（直连 Telegram 可保持注释；需要代理时取消下面注释并填写）
# ------------------------------------------------------------------------------
# [proxy]
# type = "socks5"        # 可选："socks5" / "socks4" / "http" / "mtproxy"
# host = "127.0.0.1"     # 代理服务器地址（IP 必须加双引号！）
# port = 7890            # 代理端口（纯数字，不要加引号）
# username = ""          # 可选：代理认证用户名
# password = ""          # 可选：代理认证密码
# secret = "..."         # 仅 type = "mtproxy" 时必填

# ------------------------------------------------------------------------------
# 5. 频道默认配置（可选；[[channels]] 中未填写的字段会自动继承此处的默认值）
# ------------------------------------------------------------------------------
[channel_defaults]
enabled = true
scan_mode = "full"
exclude = ["预告", "广告"]
media = ["video", "document"]
min_size = "10MB"
max_size = 0
context_before = 1
follow_replies = true
# path_template = "{channel}/{include}/{media_type}"   # 可选：覆盖全局路径模板
# download_dir = "downloads"                           # 可选：覆盖全局下载目录

# ------------------------------------------------------------------------------
# 6. 监控与下载频道列表（至少配置一个 [[channels]]，可复制多个块监控多个频道）
# ------------------------------------------------------------------------------

# 示例 A：基础单规则频道（未写的字段自动继承 [channel_defaults]）
[[channels]]
chat = "@some_public_channel"     # 频道 @用户名（加引号）或数字 ID（如 -1001234567890，用 chats 命令查看）
name = "示例频道"                  # 可选：自定义显示名（也用于 {channel} 路径变量）
enabled = true                    # 可选：false 可临时停用该频道而不删除配置
scan_mode = "search"              # 扫描模式："full"（全量增量遍历）或 "search"（频道内服务端搜索）
# search_queries = ["#4K"]        # 可选：仅 search 模式生效；留空则自动从 include/rules 提取搜索词
include = ["#4K", "原盘|REMUX"]    # 包含正则（不区分大小写，任一命中即匹配；留空 [] 表示全部匹配）
exclude = ["预告", "广告"]         # 排除正则（任一命中即跳过；不需要排除时必须写 []，切勿写 [""]）
media = ["video", "document"]     # 允许的媒体类型：photo video gif audio voice video_note document sticker
min_size = "10MB"                 # 最小文件体积（支持 KB / MB / GB，或写纯字节数 0 表示不限）
max_size = 0                      # 最大文件体积（0 表示不限，例如 "2GB"）
context_before = 1                # 将媒体前 N 条纯文字消息也纳入匹配（适合“先发介绍再发文件”的频道）
follow_replies = true             # 媒体回复的那条消息命中关键词时也视为命中
# 日期范围（可选，两端均包含；不带时区按本机时区，也可写 "2026-01-01T18:00:00+08:00"）
# since = 2026-01-01
# until = 2026-12-31

# 示例 B：同一频道按不同关键词分别下载不同媒体类型（取消下方注释即可使用）
# 配置 [[channels.rules]] 后，将按 rules 逐条匹配（优先于顶层 include / media）
# [[channels]]
# chat = -1001234567890
# name = "多规则示例频道"
# scan_mode = "full"
# exclude = ["广告"]
# min_size = "1MB"
# max_size = 0
# context_before = 1
# follow_replies = true
#
# [[channels.rules]]
# include = ["#正片", "#4K"]
# media = ["video"]               # 命中 #正片 或 #4K 时仅下载视频
#
# [[channels.rules]]
# include = ["#图集", "#壁纸"]
# media = ["photo", "document"]   # 命中 #图集 或 #壁纸 时仅下载图片与文档
